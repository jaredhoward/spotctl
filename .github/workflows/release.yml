name: Release

# Fires when a version tag is pushed (e.g. `git tag v1.2.3 && git push --tags`).
# Builds the Home Assistant (linux/arm64) binary and publishes it as a
# GitHub Release asset, replacing the manual `make build-ha-green` step.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build HA (linux/arm64) binary
        run: make build-ha-green

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--title "${{ github.ref_name }}" --generate-notes)
          # v0.x is still an unstable, actively-changing API — mark it as
          # such until the project moves to v1. Drop this once v1.0.0 ships.
          if [[ "${{ github.ref_name }}" == v0.* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${{ github.ref_name }}" \
            spotctl-linux-arm64 \
            "${args[@]}"
