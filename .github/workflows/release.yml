name: Release

# Fires when a version tag is pushed (e.g. `git tag v1.2.3 && git push --tags`).
# Builds the Home Assistant (linux/arm64) binary and publishes it as a
# GitHub Release asset, replacing the manual `make build-ha-green` step.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build HA (linux/arm64) binary
        run: make build-ha-green

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            spotctl-linux-arm64 \
            --title "${{ github.ref_name }}" \
            --generate-notes
